<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explora fotografías de dominio público e inspírate."><title>Pinboard — Descubre ideas</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff}button,input{font:inherit}button{border:0;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #1877f2;outline-offset:3px}.sidebar{position:fixed;inset:0 auto 0 0;width:80px;border-right:1px solid #e9e9e9;background:#fff;display:flex;align-items:center;flex-direction:column;padding:20px 0;gap:18px;z-index:5}.logo{color:#e60023;font-family:Georgia,serif;font-size:38px;font-weight:bold;line-height:42px;text-decoration:none}.sidebtn{width:48px;height:48px;background:transparent;border-radius:16px;display:grid;place-items:center;color:#111}.sidebtn:hover,.sidebtn.active{background:#f1f1f1}.sidebtn svg,.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.bottom{margin-top:auto}header{position:sticky;top:0;z-index:4;background:#fff;margin-left:80px;padding:16px 28px 8px;display:flex;align-items:center;gap:18px}.search{height:48px;background:#efefef;border-radius:28px;display:flex;align-items:center;gap:12px;padding:0 18px;flex:1;color:#767676}.search:focus-within{outline:4px solid #b8d8ff}.search input{width:100%;border:0;outline:0;background:transparent;color:#111;font-size:16px}.search svg{width:20px;fill:none;stroke:currentColor;stroke-width:2.5}.avatar{border-radius:50%;width:40px;height:40px;background:#e6e6e6;font-weight:700}.avatar:hover{box-shadow:0 0 0 5px #efefef}main{margin-left:80px;padding:10px 30px 60px}.tabs{display:flex;justify-content:center;gap:30px;margin:8px 0 28px}.tab{background:none;font-size:16px;font-weight:700;padding:12px 0 10px;border-bottom:3px solid transparent}.tab.active{border-color:#111}.heading{text-align:center;margin:2px auto 26px}.heading p{margin:0 0 7px;color:#767676;font-size:14px}.heading h1{font-size:23px;margin:0;font-weight:700}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:-5px auto 26px}.chip{border-radius:24px;background:#f1f1f1;padding:10px 17px;font-weight:700;font-size:14px}.chip:hover,.chip.active{background:#111;color:white}.grid{max-width:1600px;margin:auto;columns:6 210px;column-gap:16px}.pin{break-inside:avoid;margin:0 0 20px}.picture{position:relative;border-radius:20px;overflow:hidden;background:#eee;cursor:pointer}.picture img{display:block;width:100%;height:auto;min-height:120px;object-fit:cover}.picture:after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0);pointer-events:none;transition:.2s}.picture:hover:after,.picture:focus-within:after{background:rgba(0,0,0,.25)}.save{position:absolute;right:12px;top:12px;z-index:1;background:#e60023;color:#fff;border-radius:24px;padding:13px 16px;font-weight:700;opacity:0;transition:.2s}.picture:hover .save,.picture:focus-within .save{opacity:1}.save.saved{background:#111}.pin h2{font-size:14px;line-height:1.3;margin:9px 6px 4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.pin small{font-size:12px;color:#777;margin-left:6px}.state{text-align:center;color:#666;padding:65px 15px;line-height:1.6}.state button{background:#111;color:#fff;padding:12px 18px;border-radius:22px;font-weight:bold}.loader{width:34px;height:34px;border:4px solid #ddd;border-top-color:#e60023;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}dialog{border:0;border-radius:28px;padding:0;max-width:950px;width:calc(100% - 32px);max-height:90vh;box-shadow:0 8px 40px #0003}dialog::backdrop{background:#0009}.modal{display:grid;grid-template-columns:1fr 1fr;min-height:400px}.modal img{width:100%;height:100%;max-height:85vh;object-fit:contain;background:#f2f2f2}.detail{padding:32px;display:flex;flex-direction:column;align-items:flex-start;gap:18px}.detail h2{font-size:28px;line-height:1.15;margin:8px 0}.detail p{line-height:1.5;color:#555;overflow-wrap:anywhere}.detail a{color:#333;font-weight:bold}.detail-actions{display:flex;width:100%;justify-content:space-between;align-items:center}.close{border-radius:50%;width:44px;height:44px;background:#eee;font-size:24px}.modal-save{position:static;opacity:1}.help{position:fixed;right:24px;bottom:24px;border-radius:50%;height:44px;width:44px;background:white;box-shadow:0 2px 12px #0003;font-size:22px;font-weight:bold;z-index:3}@media(max-width:700px){.sidebar{inset:auto 0 0;width:auto;height:60px;border-right:0;border-top:1px solid #eee;flex-direction:row;justify-content:space-around;padding:4px 20px;gap:0}.sidebar .logo{font-size:30px}.bottom{margin:0}.sidebtn{width:44px;height:44px}header{margin:0;padding:12px 14px}.avatar{display:none}main{margin:0;padding:8px 12px 90px}.grid{columns:2 140px;column-gap:10px}.pin{margin-bottom:14px}.tabs{margin-bottom:20px}.heading h1{font-size:20px}.chips{justify-content:flex-start;flex-wrap:nowrap;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap}.modal{display:block}.modal img{height:auto;max-height:48vh}.detail{padding:20px}.detail h2{font-size:23px}.help{bottom:75px;right:14px}.save{opacity:1;padding:9px 12px;font-size:12px}}
</style></head><body><nav class="sidebar" aria-label="Navegación principal"><a class="logo" href="./" aria-label="Pinboard, inicio">P</a><button class="sidebtn active" id="home" aria-label="Inicio" title="Inicio"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></button><button class="sidebtn" id="savedNav" aria-label="Guardados" title="Guardados"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button><button class="sidebtn bottom" id="about" aria-label="Información" title="Información"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></nav><header><form class="search" id="form" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg><input id="query" type="search" placeholder="Buscar ideas" aria-label="Buscar fotografías" autocomplete="off"></form><button class="avatar" id="profile" aria-label="Ver guardados" title="Ver guardados">M</button></header><main><div class="tabs"><button class="tab active" id="forYou">Para ti</button><button class="tab" id="savedTab">Guardados</button></div><section class="heading"><p id="eyebrow">Un poco de inspiración para hoy</p><h1 id="heading">Ideas para ti</h1></section><div class="chips" id="chips" aria-label="Temas sugeridos"></div><div id="status" class="state" role="status" aria-live="polite"></div><section class="grid" id="grid" aria-label="Fotografías"></section></main><button class="help" id="help" aria-label="Acerca de las imágenes">?</button><dialog id="dialog" aria-labelledby="detailTitle"><div class="modal"><img id="detailImg" alt=""><div class="detail"><div class="detail-actions"><button class="close" id="close" aria-label="Cerrar">×</button><button class="save modal-save" id="modalSave">Guardar</button></div><h2 id="detailTitle"></h2><p id="detailCredit"></p><a id="source" target="_blank" rel="noopener noreferrer">Ver imagen y licencia en Wikimedia Commons ↗</a></div></div></dialog><script>
const $=s=>document.querySelector(s), grid=$('#grid'), status=$('#status'), query=$('#query');
const topics=[['Naturaleza','nature'],['Viajes','travel'],['Arquitectura','architecture'],['Flores','flowers'],['Arte','art'],['Animales','animals'],['Comida','food'],['Paisajes','landscape']];
const translations=Object.fromEntries(topics.map(([a,b])=>[a.toLowerCase(),b]));let photos=[],view='home', current=null, request=0;let saved={};try{saved=JSON.parse(localStorage.getItem('pinboard-saved')||'{}')}catch(e){}
const clean=s=>{const d=document.createElement('div');d.innerHTML=s||'';return (d.textContent||'').replace(/\s+/g,' ').trim()};
function persist(){try{localStorage.setItem('pinboard-saved',JSON.stringify(saved))}catch(e){}}
function drawChips(active=''){ $('#chips').innerHTML='';topics.forEach(([label,term])=>{let b=document.createElement('button');b.className='chip'+(active===term?' active':'');b.textContent=label;b.onclick=()=>{query.value=label;search(label)};$('#chips').append(b)}) }
function setView(next){view=next;$('#forYou').classList.toggle('active',next==='home');$('#savedTab').classList.toggle('active',next==='saved');$('#home').classList.toggle('active',next==='home');$('#savedNav').classList.toggle('active',next==='saved');$('#chips').hidden=next==='saved'}
function toggle(p){if(saved[p.id])delete saved[p.id];else saved[p.id]=p;persist();render();if(current?.id===p.id)$('#modalSave').textContent=saved[p.id]?'Guardado':'Guardar';}
function render(){grid.innerHTML='';const items=view==='saved'?Object.values(saved):photos;if(!items.length){status.innerHTML=view==='saved'?'Aún no tienes ideas guardadas. Explora fotos y pulsa «Guardar».':'No encontramos imágenes de dominio público para esta búsqueda. Prueba con otro término.';return}status.textContent='';for(const p of items){const article=document.createElement('article');article.className='pin';const box=document.createElement('div');box.className='picture';box.tabIndex=0;box.setAttribute('role','button');box.setAttribute('aria-label','Ver '+p.title);const image=document.createElement('img');image.src=p.url;image.alt=p.title;image.loading='lazy';image.onerror=()=>{article.remove()};const btn=document.createElement('button');btn.className='save'+(saved[p.id]?' saved':'');btn.textContent=saved[p.id]?'Guardado':'Guardar';btn.setAttribute('aria-label',(saved[p.id]?'Quitar de guardados: ':'Guardar: ')+p.title);btn.onclick=e=>{e.stopPropagation();toggle(p)};box.onclick=()=>openPhoto(p);box.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPhoto(p)}};box.append(image,btn);let title=document.createElement('h2');title.textContent=p.title;let credit=document.createElement('small');credit.textContent='Wikimedia Commons · '+p.license;article.append(box,title,credit);grid.append(article)}}
function openPhoto(p){current=p;$('#detailImg').src=p.large;$('#detailImg').alt=p.title;$('#detailTitle').textContent=p.title;$('#detailCredit').textContent=`Autor: ${p.author || 'Consultar en la fuente'} · Licencia: ${p.license}. Consulta la página de origen para conocer los detalles de la imagen.`;$('#source').href=p.page;$('#modalSave').textContent=saved[p.id]?'Guardado':'Guardar';$('#dialog').showModal()}
async function search(text=''){setView('home');let term=text.trim();let translated=translations[term.toLowerCase()]||term||'nature landscape';$('#eyebrow').textContent=term?'Explora imágenes de dominio público':'Un poco de inspiración para hoy';$('#heading').textContent=term?`Resultados para «${term}»`:'Ideas para ti';drawChips(translated);grid.innerHTML='';status.innerHTML='<div class="loader"></div>Buscando ideas…';const id=++request;try{const params=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrnamespace:'6',gsrsearch:`${translated} filetype:bitmap`,gsrlimit:'50',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'500'});const res=await fetch('https://commons.wikimedia.org/w/api.php?'+params);if(!res.ok)throw Error('network');const data=await res.json();if(id!==request)return;photos=Object.values(data.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0)).map(p=>{let i=p.imageinfo?.[0],m=i?.extmetadata||{},license=clean(m.LicenseShortName?.value);return {id:String(p.pageid),title:clean(p.title.replace(/^File:/,'' ).replace(/\.[^.]+$/,'' ).replace(/[_-]/g,' ')),url:i?.thumburl,large:i?.thumburl,page:i?.descriptionurl,license,author:clean(m.Artist?.value),usage:clean(m.UsageTerms?.value)}}).filter(p=>p.url&&p.page&&(/^(CC0|Public domain|PD|Public Domain)/i.test(p.license)||/public domain/i.test(p.usage)));render()}catch(e){if(id!==request)return;status.innerHTML='No se pudieron cargar las imágenes. Comprueba tu conexión e inténtalo de nuevo. <br><br><button id="retry">Reintentar</button>';$('#retry').onclick=()=>search(text)}}
$('#form').onsubmit=e=>{e.preventDefault();search(query.value)};function showSaved(){request++;setView('saved');$('#heading').textContent='Tus ideas guardadas';$('#eyebrow').textContent='Tu colección';render()}function showHome(){query.value='';search()}$('#savedTab').onclick=$('#savedNav').onclick=$('#profile').onclick=showSaved;$('#forYou').onclick=$('#home').onclick=showHome;$('#modalSave').onclick=()=>toggle(current);$('#close').onclick=()=>$('#dialog').close();$('#dialog').onclick=e=>{if(e.target===$('#dialog'))$('#dialog').close()};function about(){alert('Pinboard es una demostración independiente. Las fotografías se consultan en Wikimedia Commons y se filtran por dominio público o CC0. Revisa la página de cada imagen para consultar sus condiciones. Los guardados permanecen en este navegador.')};$('#help').onclick=$('#about').onclick=about;drawChips();search();
</script></body></html>
